[flavor_groups.ears]
name = "Ears"
description = "Uses the otherwise-blank space on a modern 64x64 skin in combination with alpha layer encoding to give extra features to your player model, such as ears, wings, a custom cape, breasts, a snout and more. Client only. No effect (other than seeing other players Ears skins) if you do not have an Ears skin. Client only."
side = "client"
[[flavor_groups.ears.choices]]
id = "ears_on"
name = "Yes"
description = "Installs Ears."
[[flavor_groups.ears.choices]]
id = "ears_off"
name = "No"
description = "Do not install Ears."

[flavor_groups.figura]
name = "Figura"
description = "Animation-capable player models that come directly from Blockbench, with near unlimited capabilities for customization. Client only."
side = "client"
[[flavor_groups.figura.choices]]
id = "figura_on"
name = "Yes"
description = "Installs Figura."
[[flavor_groups.figura.choices]]
id = "figura_off"
name = "No"
description = "Do not install Figura."

[flavor_groups.mousetweaks]
name = "Mouse Tweaks"
description = "It's Mouse Tweaks. Either you know what it does, or you're living under a rock."
side = "both"
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_on"
name = "Yes"
description = "Installs Mouse Tweaks."
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_off"
name = "No"
description = "Do not install Mouse Tweaks."

[flavor_groups.invessentials]
name = "Inventory Essentials"
description = "Adds minimal, consistent inventory features. Ctrl-click stack to move single item, shift-ctrl-click item to move all stacks of that item, shift-drag to move items. Client with additional server functionality."
side = "both"
[[flavor_groups.invessentials.choices]]
id = "invessentials_on"
name = "Yes"
description = "Installs Inventory Essentials."
[[flavor_groups.invessentials.choices]]
id = "invessentials_off"
name = "No"
description = "Do not install Inventory Essentials."

[flavor_groups.dh]
name = "Double Hotbar"
description = "Installs Double Hotbar, adding a row of your inventory as an easily-switchable preview hotbar row. Does not allow you to actually use items in the extra hotbar."
side = "client"
[[flavor_groups.dh.choices]]
id = "dh_on"
name = "Yes"
description = "Installs Double Hotbar."
[[flavor_groups.dh.choices]]
id = "dh_off"
name = "No"
description = "Do not install Double Hotbar."

[flavor_groups.mud]
name = "More Overlays"
description = "Classical light and chunk overlays toggled with F7 and F9, just like NEIs used to be. Client only."
side = "client"
[[flavor_groups.mud.choices]]
id = "mud_on"
name = "Yes"
description = "Installs More Overlays."
[[flavor_groups.mud.choices]]
id = "mud_off"
name = "No"
description = "Do not install More Overlays."

[flavor_groups.lucent]
name = "Lucent"
description = "Installs Lucent, adding client-sided dynamic lighting that does <i>not</i> work by constantly placing light and water blocks. It also does not actually light up an area to prevent mob spawns or trigger light detection."
side = "client"
[[flavor_groups.lucent.choices]]
id = "lucent_on"
name = "Yes"
description = "Installs Lucent."
[[flavor_groups.lucent.choices]]
id = "lucent_off"
name = "No"
description = "Do not install Lucent."

[flavor_groups.neoauth]
name = "Neoauth"
description = "Reauthentication without closing the game. Client only."
side = "client"
[[flavor_groups.neoauth.choices]]
id = "neoauth_on"
name = "Yes"
description = "Installs Neoauth."
[[flavor_groups.neoauth.choices]]
id = "neoauth_off"
name = "No"
description = "Do not install Neoauth."

[metafile.ears]
flavors = "ears_on"
