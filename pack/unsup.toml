[flavor_groups.invsorter]
name = "Inventory Sorter"
description = "Simple inventory sorting and scroll item movement. Middle click sorts, mousewheel in and out of inventory one item at a time. Both required for functionality, but optional on client."
side = "both"
[[flavor_groups.invsorter.choices]]
id = "invsorter_on"
name = "Yes"
description = "Installs Inventory Sorter."
[[flavor_groups.invsorter.choices]]
id = "invsorter_off"
name = "No"
description = "Do not install Inventory Sorter."

[flavor_groups.mousetweaks]
name = "Mouse Tweaks"
description = "It's Mouse Tweaks. Either you know what it does, or you're living under a rock."
side = "both"
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_on"
name = "Yes"
description = "Installs Mouse Tweaks."
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_off"
name = "No"
description = "Do not install Mouse Tweaks."

[flavor_groups.dh]
name = "Double Hotbar"
description = "Installs Double Hotbar, adding a row of your inventory as an easily-switchable preview hotbar row. Does not allow you to actually use items in the extra hotbar."
side = "client"
[[flavor_groups.dh.choices]]
id = "dh_on"
name = "Yes"
description = "Installs Double Hotbar."
[[flavor_groups.dh.choices]]
id = "dh_off"
name = "No"
description = "Do not install Double Hotbar."

[flavor_groups.ears]
name = "Ears"
description = "Uses the otherwise-blank space on a modern 64x64 skin in combination with alpha layer encoding to give extra features to your player model, such as ears, wings, a custom cape, breasts, a snout and more. Client only. No effect (other than seeing other players Ears skins) if you do not have an Ears skin. Client only."
side = "client"
[[flavor_groups.ears.choices]]
id = "ears_on"
name = "Yes"
description = "Installs Ears."
[[flavor_groups.ears.choices]]
id = "ears_off"
name = "No"
description = "Do not install Ears."

[flavor_groups.figura]
name = "Figura"
description = "Completely replaces the player model with a blockbench-created model, complete with custom textures, animations, size and sounds. Client only."
side = "client"
[[flavor_groups.figura.choices]]
id = "figura_on"
name = "Yes"
description = "Installs Figura."
[[flavor_groups.figura.choices]]
id = "figura_off"
name = "No"
description = "Do not install Figura."

[flavor_groups.embeddium]
name = "Embeddium"
description = "Installs Embeddium, overhauling rendering to make it more efficient and reducing clientside lag."
side = "client"
[[flavor_groups.embeddium.choices]]
id = "embeddium_on"
name = "Yes"
description = "Installs Embeddium."
[[flavor_groups.embeddium.choices]]
id = "embeddium_off"
name = "No"
description = "Do not install Embeddium."

[flavor_groups.lucent]
name = "Lucent"
description = "Installs Lucent, adding client-sided dynamic lighting that does <i>not</i> work by constantly placing light and water blocks. It also does not actually light up an area to prevent mob spawns or trigger light detection."
side = "client"
[[flavor_groups.lucent.choices]]
id = "lucent_on"
name = "Yes"
description = "Installs Lucent."
[[flavor_groups.lucent.choices]]
id = "lucent_off"
name = "No"
description = "Do not install Lucent."

[flavor_groups.fonts]
name = "Fontolith"
description = "Installs Fontolith, Idi's custom font resourcepack, or Unsanded, a font pack by Unascribed."
side = "client"
[[flavor_groups.fonts.choices]]
id = "fonts_fontolith"
name = "Fontolith"
description = "Installs Fontolith."
[[flavor_groups.fonts.choices]]
id = "fonts_unsanded"
name = "Unsanded"
description = "Installs Unsanded."
[[flavor_groups.fonts.choices]]
id = "fonts_none"
name = "None"
description = "Do not install any custom fonts."


[metafile.inventory-sorter]
flavors = "invsorter_on"
