
#General settings
[general]
	#Enable instant shell construction (creative mode)
	enableInstantShellConstruction = false
	#Warn player instead of killing them when they don't have enough health
	warnPlayerInsteadOfKilling = false

#Damage settings
[damage]
	#Damage dealt when creating a shell (in half hearts)
	#Range: 0.0 ~ 40.0
	fingerstickDamage = 20.0
	#Damage dealt when creating a shell in hardcore mode
	#Range: 0.0 ~ 80.0
	hardcoreFingerstickDamage = 40.0

#Energy settings
[energy]
	#Energy capacity/requirement for shell constructor
	#Range: 1000 ~ 9223372036854775807
	shellConstructorCapacity = 256000
	#Energy capacity of shell storage
	#Range: 0 ~ 9223372036854775807
	shellStorageCapacity = 320
	#Energy consumption per tick for shell storage
	#Range: 0 ~ 1000
	shellStorageConsumption = 16

#Shell Storage settings
[shellStorage]
	#Whether shell storage accepts redstone power
	acceptsRedstone = true
	#Maximum time (in ticks) shell storage can run without power
	#Range: 0 ~ 6000
	maxUnpoweredLifespan = 20

#Energy production settings
[energyProduction]
	#Entity energy production map (format: 'entity_id:energy_per_tick')
	energyMap = ["minecraft:chicken:2", "minecraft:pig:16", "minecraft:player:20", "minecraft:villager:25", "minecraft:wolf:22", "minecraft:creeper:80", "minecraft:enderman:160"]

#Synchronization settings
[sync]
	#Shell priority order for automatic synchronization
	#Valid values: WHITE, ORANGE, MAGENTA, LIGHT_BLUE, YELLOW, LIME, PINK, GRAY,
	#LIGHT_GRAY, CYAN, PURPLE, BLUE, BROWN, GREEN, RED, BLACK, NEAREST, NATURAL
	syncPriority = ["NATURAL"]
	#If enabled, all shells share the same origins
	preserveOrigins = false

#Tool settings
[tools]
	#Item ID to use as wrench
	wrench = "minecraft:stick"

#Miscellaneous settings
[misc]
	#Update translations automatically on game launch
	updateTranslationsAutomatically = false

#Easter egg settings
[easterEggs]
	#Enable Technoblade easter egg
	enableTechnobladeEasterEgg = true
	#Render Technoblade's cape
	renderTechnobladeCape = false
	#Allow Technoblade announcements
	allowTechnobladeAnnouncements = true
	#Allow Technoblade quotes
	allowTechnobladeQuotes = true
	#Delay between Technoblade quotes (in ticks)
	#Range: 200 ~ 72000
	technobladeQuoteDelay = 1800
	#UUIDs of players to treat as Technoblade
	technobladeUuids = []

